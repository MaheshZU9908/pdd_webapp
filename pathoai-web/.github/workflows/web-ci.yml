name: PathoAI Web — CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'pathoai-web/**'
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pathoai-web/**'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: E2E Tests ──────────────────────────────────────────────────────────
  e2e-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (Chrome + ChromeDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver
          echo "Chrome and ChromeDriver installed"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install web test dependencies
        run: |
          pip install -r pathoai-web/requirements-test.txt

      - name: Start FastAPI backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo "FastAPI backend started"

      - name: Wait for backend to be ready
        run: |
          timeout 60s bash -c 'until curl --silent --fail http://127.0.0.1:8000/health; do echo "Waiting..."; sleep 2; done'
          echo "Backend is healthy!"

      - name: Run Selenium E2E tests
        env:
          PYTHONPATH: ${{ github.workspace }}/pathoai-web/tests/e2e:${{ github.workspace }}/backend
        run: |
          cd pathoai-web
          pytest tests/e2e/test_web.py -v

  # ── Job 2: Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy web frontend to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pathoai-web/src
          publish_branch: gh-pages
