name: PathoAI Web — CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'pathoai-web/**'
  workflow_dispatch:  # allows manual trigger from the Actions tab

# Required permissions for GitHub Pages deployment via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress on new push
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Build ─────────────────────────────────────────────────────────────
  build:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pathoai-web/package-lock.json

      - name: Install dependencies
        run: cd pathoai-web && npm ci

      - name: Build with Vite
        run: cd pathoai-web && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match vite.config.js build.outDir (dist/)
          path: pathoai-web/dist

  # ── Job 2: Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 3: Smoke test (non-blocking) ─────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    # Never block or fail the overall workflow if the smoke test fails
    continue-on-error: true

    steps:
      - name: Wait for Pages propagation
        run: sleep 30

      - name: Check live site returns HTTP 200
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            https://MaheshZU9908.github.io/pdd_webapp/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Pages returned $STATUS — may still be propagating"
          else
            echo "✅ Site is live and returning 200!"
          fi
