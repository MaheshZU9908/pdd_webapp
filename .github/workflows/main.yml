name: PathoAI Backend — CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Health & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start FastAPI backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo "FastAPI backend started"

      - name: Wait for backend to be healthy
        run: |
          timeout 60s bash -c 'until curl --silent --fail http://127.0.0.1:8000/health; do echo "Waiting..."; sleep 2; done'
          echo "Backend is healthy!"

      - name: Verify API health endpoint
        run: |
          RESPONSE=$(curl --silent http://127.0.0.1:8000/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'
          echo "Health check passed!"
