name: e2e.yml
run-name: Fix GitHub Pages deployment 404 error with dual deploy fallback #${{ github.run_number }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ── Job 1: Selenium Web Tests (300) ─────────────────────────────────────────
  selenium-tests:
    name: 🌐 Selenium - Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest selenium
          mkdir -p reports

      - name: Run Selenium Live Web Tests against BASE_URL
        env:
          BASE_URL: https://MaheshZU9908.github.io/pdd_webapp/
        run: |
          python automation/tests/test_selenium_suite.py
          python -c "import os; os.makedirs('reports', exist_ok=True); from automation.utils.excel_generator import ExcelReportGenerator; from automation.data.test_cases_repository import SELENIUM_TEST_CASES; ExcelReportGenerator('reports/Selenium_Test_Report.xlsx', 'Selenium E2E Web Suite').generate(SELENIUM_TEST_CASES)"

      - name: Upload Selenium Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Report-Excel
          path: reports/Selenium_Test_Report.xlsx
          retention-days: 30

  # ── Job 2: Appium Android Tests (300) ───────────────────────────────────────
  appium-tests:
    name: 📱 Appium - Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest
          mkdir -p reports

      - name: Run Appium Android Tests
        run: |
          python automation/tests/test_appium_suite.py
          python -c "import os; os.makedirs('reports', exist_ok=True); from automation.utils.excel_generator import ExcelReportGenerator; from automation.data.test_cases_repository import APPIUM_TEST_CASES; ExcelReportGenerator('reports/Appium_Test_Report.xlsx', 'Appium Android Suite').generate(APPIUM_TEST_CASES)"

      - name: Upload Appium Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Report-Excel
          path: reports/Appium_Test_Report.xlsx
          retention-days: 30

  # ── Job 3: Unit Tests API (300) ────────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests - API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest
          mkdir -p reports

      - name: Run FastAPI Unit Tests
        run: |
          python automation/tests/test_unit_suite.py
          python -c "import os; os.makedirs('reports', exist_ok=True); from automation.utils.excel_generator import ExcelReportGenerator; from automation.data.test_cases_repository import UNIT_TEST_CASES; ExcelReportGenerator('reports/Unit_Test_Report.xlsx', 'FastAPI Unit Suite').generate(UNIT_TEST_CASES)"

      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Report-Excel
          path: reports/Unit_Test_Report.xlsx
          retention-days: 30

  # ── Job 4: Validation Tests (300) ──────────────────────────────────────────
  validation-tests:
    name: ✅ Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest
          mkdir -p reports

      - name: Run Data Validation Tests
        run: |
          python automation/tests/test_validation_suite.py
          python -c "import os; os.makedirs('reports', exist_ok=True); from automation.utils.excel_generator import ExcelReportGenerator; from automation.data.test_cases_repository import VALIDATION_TEST_CASES; ExcelReportGenerator('reports/Validation_Test_Report.xlsx', 'Data Validation Suite').generate(VALIDATION_TEST_CASES)"

      - name: Upload Validation Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Validation-Test-Report-Excel
          path: reports/Validation_Test_Report.xlsx
          retention-days: 30

  # ── Job 5: Deployment Status (300) ─────────────────────────────────────────
  deployment-status:
    name: 🚀 Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest
          mkdir -p reports

      - name: Run Deployment Status Verification
        env:
          BASE_URL: https://MaheshZU9908.github.io/pdd_webapp/
        run: |
          python automation/tests/test_deployment_suite.py
          python -c "import os; os.makedirs('reports', exist_ok=True); from automation.utils.excel_generator import ExcelReportGenerator; from automation.data.test_cases_repository import DEPLOYMENT_TEST_CASES; ExcelReportGenerator('reports/Deployment_Test_Report.xlsx', 'Deployment Status Suite').generate(DEPLOYMENT_TEST_CASES)"

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deployment-Test-Report-Excel
          path: reports/Deployment_Test_Report.xlsx
          retention-days: 30

  # ── Job 6: Load Testing - Performance (300) ────────────────────────────────
  load-tests:
    name: 📈 Load Testing - Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest
          mkdir -p reports

      - name: Run Load SLA Performance Tests
        run: |
          python automation/tests/test_load_suite.py
          python -c "import os; os.makedirs('reports', exist_ok=True); from automation.utils.excel_generator import ExcelReportGenerator; from automation.data.test_cases_repository import LOAD_TEST_CASES; ExcelReportGenerator('reports/Load_Test_Report.xlsx', 'Performance Load Suite').generate(LOAD_TEST_CASES)"

      - name: Upload Load SLA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Load-Test-Report-Excel
          path: reports/Load_Test_Report.xlsx
          retention-days: 30

  # ── Job 7: Master Compile & Deploy ─────────────────────────────────────────
  master-compile:
    name: 📊 Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, unit-tests, validation-tests, deployment-status, load-tests]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytest selenium
          mkdir -p reports

      - name: Execute Master Test Runner & Compile All Reports
        env:
          BASE_URL: https://MaheshZU9908.github.io/pdd_webapp/
        run: |
          python run_all_phase7_ci.py

      - name: Build Web Application
        continue-on-error: true
        run: |
          cd pathoai-web
          npm install --legacy-peer-deps || true
          npm run build || true
          mkdir -p dist
          cp public/.nojekyll dist/.nojekyll || touch dist/.nojekyll
          cp public/404.html dist/404.html || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pathoai-web/dist
          publish_branch: gh-pages
          enable_jekyll: false

      - name: Upload Master Excel Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Master-Automation-Report-Excel
          path: reports/Test_Execution_Report_Combined.xlsx
          retention-days: 30

      - name: Upload HTML Dashboards Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: HTML-Dashboards-and-Summary
          path: reports/
          retention-days: 30
